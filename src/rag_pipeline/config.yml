# ==============================================================
# InterviewPrep AI - Generation Pipeline Configuration
# ==============================================================

gcp:
  project_id: "professorbot-dovbsg"
  region: "us-central1"
  model_registry_name: "interviewprep-ai-retrieval"

database:
  host: "34.148.0.165"
  port: 5432
  dbname: "interviewprep-ai-database"

retrieval:
  top_k: 5
  fetch_multiplier: 3       # over-fetch factor for RRF fusion
  rrf_k: 60
  bm25_weight: 0.3
  vector_weight: 0.7

# Mapping: model name → (dimension, db column)
embedding_models:
  "all-MiniLM-L6-v2":
    dim: 384
    column: "embedding_all_minilm_l6_v2"
  "all-mpnet-base-v2":
    dim: 768
    column: "embedding_all_mpnet_base_v2"

generation:
  openai_model: "gpt-4o-mini"
  temperature: 0.3
  max_tokens: 1024