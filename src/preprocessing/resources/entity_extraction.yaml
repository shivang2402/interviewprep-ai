# ─── Round Detection Patterns ─────────────────────
# Regex patterns to identify individual interview rounds.
# Each match = one round reference. Code counts unique matches.

round_patterns:
  # "Round 1", "Round 2", etc.
  - "round\\s*(\\d+)"
  # "1st round", "2nd round", "3rd round"
  - "(\\d+)(?:st|nd|rd|th)\\s*round"
  # Named rounds: "Technical Round", "HR Round", "Coding Round"
  - "(technical\\s+(?:round|interview))"
  - "(hr\\s+(?:round|interview))"
  - "(coding\\s+(?:round|interview|test))"
  - "(managerial\\s+(?:round|interview))"
  - "(aptitude\\s+(?:round|test))"
  - "(system\\s+design\\s+(?:round|interview))"
  - "(behavioral\\s+(?:round|interview))"
  - "(phone\\s+(?:screen(?:ing)?|round|interview))"
  - "(onsite\\s+(?:round|interview))"
  - "(final\\s+(?:round|interview))"
  - "(group\\s+discussion)"
  - "(pdm\\s+(?:round|interview))"
  - "(culture\\s+fit\\s+(?:round|interview))"
  - "(bar\\s+raiser\\s+(?:round|interview))"
  - "(hiring\\s+manager\\s+(?:round|interview))"


